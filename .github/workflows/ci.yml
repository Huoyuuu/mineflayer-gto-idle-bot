name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.12
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: docker build -t minecraft-idle-bot:test .
