<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Idle Bot · 世界视图</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231c1917'/><rect x='4' y='4' width='8' height='8' rx='1' fill='%23faf9f7'/></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="shell">

  <aside class="panel rail">
    <header class="rail-head">
      <div class="eyebrow">minimal presence</div>
      <h1>Idle Bot</h1>
      <div class="phase"><span id="phase-dot" class="dot"></span><span id="phase-text">offline</span></div>
      <p id="phase-note" class="note"></p>
    </header>

    <section class="block">
      <div class="eyebrow">vitals</div>
      <div class="meter"><span class="meter-label">生命</span><div class="bar"><i id="health-bar" class="fill health"></i></div><span id="health-text" class="meter-value">--</span></div>
      <div class="meter"><span class="meter-label">饥饿</span><div class="bar"><i id="food-bar" class="fill food"></i></div><span id="food-text" class="meter-value">--</span></div>
    </section>

    <section class="block">
      <div class="eyebrow">telemetry</div>
      <dl id="info" class="info"></dl>
    </section>

    <section class="block">
      <div class="eyebrow">hotbar</div>
      <div id="hotbar" class="hotbar"></div>
      <div id="inventory" class="inventory"></div>
    </section>

    <section class="block">
      <div class="eyebrow">actions</div>
      <div class="actions">
        <button id="return-p0" type="button">回到初始位置 P0</button>
        <button id="empty-silencer" type="button">清空消声仓到箱子</button>
      </div>
      <p id="action-note" class="note"></p>
    </section>
  </aside>

  <section class="panel stage">
    <div class="toolbar">
      <div class="toolbar-main">
        <span class="eyebrow">world</span>
        <strong id="world-name">--</strong>
        <span id="world-clock" class="chip"></span>
        <span id="world-chunks" class="chip subtle"></span>
      </div>
      <div class="toolbar-tools">
        <label class="tool"><span>层高 Y</span><input id="ceiling" type="range" min="-64" max="320" step="1" value="120"><output id="ceiling-value">--</output></label>
        <label class="tool"><span>范围</span><select id="radius"><option value="12">12</option><option value="20" selected>20</option><option value="32">32</option><option value="48">48</option></select></label>
        <button id="rotate" class="ghost" type="button" title="旋转视角 (R)">⟳</button>
        <button id="recenter" class="ghost" type="button" title="回到 Bot 视角">⌖</button>
      </div>
    </div>

    <div class="viewport">
      <canvas id="map" tabindex="0" aria-label="世界等距视图"></canvas>
      <div id="control-badge" class="badge">点击画布接管控制</div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div class="legend">
        <div><b>左键</b> 选中 · <b>拖动</b> 平移 · <b>滚轮</b> 缩放 · <b>R</b> 旋转</div>
        <div><b>右键/双击</b> 使用 · <b>Shift+双击</b> 立即挖掘 · <b>Esc</b> 释放控制</div>
      </div>
      <div id="keycaps" class="keycaps">
        <span data-key="KeyQ">Q</span><span data-key="KeyW">W</span><span data-key="KeyE">E</span>
        <span data-key="KeyA">A</span><span data-key="KeyS">S</span><span data-key="KeyD">D</span>
        <span data-key="Space" class="wide">Space</span><span data-key="ShiftLeft">Shift</span><span data-key="ControlLeft">Ctrl</span>
      </div>
    </div>

    <div class="statusbar">
      <span id="selection">未选中方块</span>
      <span id="world-state" class="subtle"></span>
    </div>
  </section>

  <aside class="panel chat-panel">
    <div class="chat-head">
      <div class="eyebrow">chat</div>
      <div class="chat-head-tools">
        <span id="chat-total" class="chip subtle"></span>
        <button id="load-older" class="ghost" type="button" hidden>加载更早</button>
      </div>
    </div>
    <div id="chat" class="chat"></div>
    <button id="jump-latest" class="jump" type="button" hidden>↓ 回到最新</button>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="message" maxlength="256" placeholder="发送消息 / 指令" aria-label="发送消息">
      <button type="submit" title="发送">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      </button>
    </form>
  </aside>

</main>
<script src="/view-math.js"></script>
<script src="/app.js"></script>
</body>
</html>
