<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Bot</title><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>:root{font-family:ui-monospace,monospace;color:#292524;background:#fafaf9}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:240px minmax(420px,1fr) 320px;height:100vh;gap:1px;background:#d6d3d1}.panel{background:#fff;min-width:0}.left,.right{padding:18px;overflow:auto}.left{display:flex;flex-direction:column;gap:16px}.title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#78716c}.info{display:grid;gap:8px;font-size:12px}.info div{display:flex;justify-content:space-between}.info dt{color:#78716c}.actions{display:grid;gap:8px}.actions button{border:1px solid #292524;background:#292524;color:#fff;padding:9px}.center{display:flex;flex-direction:column}.toolbar{height:44px;border-bottom:1px solid #e7e5e4;padding:14px;font-size:11px;display:flex;justify-content:space-between}.map{flex:1;background:#eef2f1;position:relative}.map canvas{width:100%;height:100%;display:block}.hint{position:absolute;left:12px;bottom:10px;background:#fffddcdd;padding:6px;font-size:10px}.right{display:flex;flex-direction:column}.chat-title{font-size:11px;letter-spacing:.14em;color:#78716c}.chat{flex:1;overflow:auto;border-top:1px solid #e7e5e4;margin-top:12px;padding-top:12px;font-size:12px}.msg{margin:0 0 8px}.msg time{color:#a8a29e;margin-right:5px}.chat-form{display:flex;gap:6px;border-top:1px solid #e7e5e4;padding-top:10px}.chat-form input{min-width:0;flex:1;padding:8px;border:1px solid #d6d3d1}.chat-form button{width:40px;background:#292524;color:#fff;border:0}@media(max-width:900px){.shell{grid-template-columns:190px 1fr}.right{grid-column:1/-1;height:300px}}</style></head><body><main class="shell"><aside class="panel left"><div class="title">minimal presence</div><h1 style="font-size:20px;margin:0">Idle Bot</h1><div id="phase">offline</div><dl id="info" class="info"></dl><div class="actions"><button id="return-p0">回到初始位置 P0</button><button id="empty-silencer">清空消声仓到箱子</button></div><div class="title">inventory</div><div id="inventory" style="font-size:9px"></div><div style="font-size:10px;color:#78716c">WASD 移动，Shift/Space 修饰，左键/右键交互</div></aside><section class="panel center"><div class="toolbar"><span>3D NEIGHBORHOOD · 16×16×16</span><span id="target">未选中</span></div><div class="map"><canvas id="map" tabindex="0"></canvas><div class="hint">点击选中方块；双击可交互容器</div></div></section><aside class="panel right"><div class="chat-title">CHAT</div><div id="chat" class="chat"></div><form id="chat-form" class="chat-form"><input id="message" maxlength="256" placeholder="发送消息"><button type="submit"><i data-lucide="send"></i></button></form></aside></main><script>
const $=function(s){return document.querySelector(s)},phase=$("#phase"),info=$("#info"),chat=$("#chat"),canvas=$("#map"),ctx=canvas.getContext("2d");let state=null,target=null,messages=[],keys=new Set();const esc=function(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})};
function render(s){state=s;phase.textContent=s.phase+(s.action?" · "+s.action:"");info.innerHTML=[["name",s.username],["world",s.world||"--"],["health",s.health==null?"--":s.health+" / 20"],["position",s.position?Number(s.position.x).toFixed(1)+", "+Number(s.position.y).toFixed(1)+", "+Number(s.position.z).toFixed(1):"--"],["P0",s.p0?Number(s.p0.x).toFixed(1)+", "+Number(s.p0.y).toFixed(1)+", "+Number(s.p0.z).toFixed(1):"--"],["retry",s.nextReconnectAt?new Date(s.nextReconnectAt).toLocaleTimeString():"--"]].map(function(x){return "<div><dt>"+x[0]+"</dt><dd>"+esc(x[1])+"</dd></div>"}).join("");$("#inventory").textContent=(s.inventory||[]).map(function(x){return x&&x.itemId?x.itemId+" ×"+x.itemCount:"-"}).join(" | ");draw()}
function draw(){var w=canvas.clientWidth,h=canvas.clientHeight,d=devicePixelRatio||1;canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);var ox=w/2,oy=100,sx=Math.min(24,w/24),sy=sx*.52;for(var z=-8;z<8;z++)for(var x=-8;x<8;x++){var px=ox+(x-z)*sx,py=oy+(x+z)*sy;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+sx,py+sy);ctx.lineTo(px,py+sy*2);ctx.lineTo(px-sx,py+sy);ctx.closePath();ctx.fillStyle=(x+z)%2?"#aeb9b4":"#9ca3af";ctx.fill();ctx.strokeStyle="#87928d";ctx.stroke()}if(target){var tx=ox+(target.x-(state.position.x|0)-target.z+(state.position.z|0))*sx,tz=oy+(target.x-(state.position.x|0)+target.z-(state.position.z|0))*sy;ctx.strokeStyle="#dc2626";ctx.lineWidth=3;ctx.strokeRect(tx-sx,tz,sx*2,sy*2);ctx.lineWidth=1}}
function select(){if(!state||!state.position)return;target={x:state.position.x|0,y:state.position.y|0,z:state.position.z|0};$("#target").textContent=target.x+","+target.y+","+target.z;draw()};async function input(e){if(!target)return;var r=await fetch("/api/world-input",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({button:e.button===2?"right":"left",shiftKey:e.shiftKey,spaceKey:keys.has("Space"),target:target})});if(!r.ok)alert((await r.json()).error)}
function syncKeys(){fetch("/api/control",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({forward:keys.has("KeyW"),back:keys.has("KeyS"),left:keys.has("KeyA"),right:keys.has("KeyD"),sprint:keys.has("ShiftLeft")||keys.has("ShiftRight"),jump:keys.has("Space")})}).catch(function(){})};canvas.oncontextmenu=function(e){e.preventDefault()};canvas.onclick=select;canvas.onmousedown=input;window.onkeydown=function(e){if(["KeyW","KeyA","KeyS","KeyD","ShiftLeft","ShiftRight","Space"].indexOf(e.code)>=0){e.preventDefault();keys.add(e.code);syncKeys()}};window.onkeyup=function(e){keys.delete(e.code);syncKeys()};async function action(name){var r=await fetch("/api/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:name})});if(!r.ok)alert((await r.json()).error)}$("#return-p0").onclick=function(){action("return-p0")};$("#empty-silencer").onclick=function(){action("empty-silencer")};function renderChat(){chat.innerHTML=messages.map(function(m){return "<p class=msg><time>"+new Date(m.at).toLocaleTimeString()+"</time><b>"+esc(m.sender)+"</b> "+esc(m.text)+"</p>"}).join("");chat.scrollTop=chat.scrollHeight};$("#chat-form").onsubmit=async function(e){e.preventDefault();var i=$("#message"),m=i.value.trim();if(!m)return;var r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:m})});if(r.ok)i.value=""};fetch("/api/state").then(function(r){return r.json()}).then(render);fetch("/api/chat?limit=100").then(function(r){return r.json()}).then(function(d){messages=d.items;renderChat()});var ev=new EventSource("/events");ev.addEventListener("state",function(e){render(JSON.parse(e.data))});ev.addEventListener("chat",function(e){messages.push(JSON.parse(e.data));renderChat()});addEventListener("resize",draw);lucide.createIcons();draw();
</script></body></html>
